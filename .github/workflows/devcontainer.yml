name: devcontainer GHCR publication

on:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        required: false
        default: false
    outputs:
      image_ref:
        description: Verified immutable image reference.
        value: ${{ jobs.publish.outputs.image_ref }}

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'WasmEdge/devcontainer' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.candidate)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ '${{ inputs.candidate }}' = true ]; then
            tag=$(python3 .github/scripts/devcontainer/publication.py candidate --pr '${{ github.event.number }}' \
              --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$ATTEMPT")
          else
            tag=$(python3 .github/scripts/devcontainer/publication.py tag \
              --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$ATTEMPT")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.repository == 'WasmEdge/devcontainer' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.candidate)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push native platform
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.ci-image-base.hcl
          targets: ${{ matrix.target }}
          push: true
          set: |
            ${{ matrix.target }}.tags=ghcr.io/wasmedge/devcontainer:${{ needs.prepare.outputs.tag }}-stage-${{ matrix.arch }}
            ${{ matrix.target }}.labels.org.opencontainers.image.source=https://github.com/WasmEdge/devcontainer
            ${{ matrix.target }}.labels.org.opencontainers.image.revision=${{ github.sha }}

  publish:
    needs:
      - prepare
      - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble and verify multi-platform index
        id: publish
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          image=ghcr.io/wasmedge/devcontainer
          docker buildx imagetools create --tag "$image:$TAG" \
            "$image:$TAG-stage-amd64" "$image:$TAG-stage-arm64"
          docker buildx imagetools inspect --raw "$image:$TAG" > index.json
          python3 .github/scripts/devcontainer/publication.py verify-index --index index.json
          digest=$(docker buildx imagetools inspect "$image:$TAG" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          python3 .github/scripts/devcontainer/publication.py validate-digest --digest "$digest"
          if [ '${{ inputs.candidate }}' != true ]; then
            docker buildx imagetools create --tag "$image:latest" "$image@$digest"
          fi
          echo "image_ref=$image@$digest" >> "$GITHUB_OUTPUT"
