name: Build on Alpine (static lib)

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_on_alpine_static:
    name: Build on Alpine (static lib)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download WasmEdge 0.18.1 source
        run: |
          curl -fsSL https://github.com/WasmEdge/WasmEdge/archive/refs/tags/0.18.1.tar.gz -o WasmEdge-0.18.1.tar.gz
          mkdir -p WasmEdge-0.18.1
          tar -xzf WasmEdge-0.18.1.tar.gz --strip-components=1 -C WasmEdge-0.18.1
          printf '0.18.1\n' > WasmEdge-0.18.1/VERSION
      - name: Checkout devcontainer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: devcontainer
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build WasmEdge
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./devcontainer
          files: docker-bake.alpine-static.hcl
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-libs-alpine
          path: ./devcontainer/build/*/WasmEdge-*.tar.gz
      - name: Reject release upload
        if: ${{ inputs.release }}
        run: |
          echo "release upload is not enabled in devcontainer" >&2
          exit 1
